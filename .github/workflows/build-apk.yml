name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK for release
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/abaq-portal-app.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaq-portal-debug-apk
          path: output/abaq-portal-app.apk
          retention-days: 30

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Abaq Portal Android App v1.0.0"
          body: "تطبيق بوابة عبق للأندرويد بتصميم الشاشات الـ 14 الحديث وبدون أي شريط متصفح."
          files: output/abaq-portal-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
