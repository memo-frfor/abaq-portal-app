name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release-key.jks \
            -alias abaqkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass abaqportal123 \
            -keypass abaqportal123 \
            -dname "CN=AbaqPortal, OU=Mobile, O=Abaq, L=Riyadh, ST=Riyadh, C=SA"

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK for release
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/abaq-portal-app.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaq-portal-release-apk
          path: output/abaq-portal-app.apk
          retention-days: 30

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Abaq Portal Android App v1.1.0 (Signed Release)"
          body: "تطبيق بوابة عبق للأندرويد - نسخة Release رسمية موقعة رقمياً ومحدثة بالتصميم الجديد لكيو للمقاضي."
          files: output/abaq-portal-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
